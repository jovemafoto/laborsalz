name: laborsalz-ai-studio

services:
  ai-studio:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ai.laborsalz.com}
        NEXT_PUBLIC_STUDIO_NAME: ${NEXT_PUBLIC_STUDIO_NAME:-LaborSalz AI Studio}
    container_name: laborsalz-ai-studio
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: "1.50"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      LABORSALZ_STORAGE_ROOT: /data
    ports:
      - "127.0.0.1:${LABORSALZ_AI_PORT:-3010}:3000"
    volumes:
      - type: bind
        source: ${LABORSALZ_AI_STORAGE_HOST}
        target: /data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v2/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
